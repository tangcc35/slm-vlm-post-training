[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slm-post-train"
version = "0.1.0"
description = "Modular SLM and VLM post-training with Unsloth and uv"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch",
    "unsloth",
    "trl>=0.14.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "bitsandbytes",
    "peft>=0.14.0",
    "pyyaml>=6.0",
    "sentencepiece",
    "protobuf",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
slm-post-train = "slm_post_train.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_post_train"]
