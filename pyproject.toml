[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slm-post-train"
version = "0.1.0"
description = "Modular SLM and VLM post-training with Unsloth and uv"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch",
    "unsloth",
    "trl>=0.14.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "bitsandbytes",
    "peft>=0.14.0",
    "pyyaml>=6.0",
    "sentencepiece",
    "protobuf",
    "wandb>=0.30.0",
    "google-adk>=2.7.0",
    "litellm>=1.101.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic>=2.13.5",
    "llama-cpp-python[server]>=0.3.35",
    "sse-starlette>=3.4.11",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "openinference-instrumentation-google-adk>=0.1.28",
    "arize-phoenix-otel>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
phoenix = [
    "arize-phoenix",
]

[project.scripts]
slm-post-train = "slm_post_train.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_post_train", "src/story_rp_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]

